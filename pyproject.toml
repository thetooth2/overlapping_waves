[project]
name = "trial1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thetooth2", email = "benedictbinu7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anesthetic>=2.16.0",
    "blackjax>=1.7.1",
    "jax>=0.12.0.1",
    "jimgw>=0.6.1",
    "matplotlib>=3.11.2",
    "matplotlib-inline>=0.2.2",
    "ripplegw>=0.5.0",
    "stack-data>=0.6.3",
    "tqdm>=4.70.1",
]

[project.scripts]
trial1 = "trial1:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "trial1",
]
